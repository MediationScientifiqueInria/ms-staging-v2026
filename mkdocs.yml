site_name: Médiation scientifique - Inria
site_url: !ENV [MKDOCS_SITE_URL, ""]

extra:
  noindex: !ENV [MKDOCS_NO_INDEX, false]

theme:
  font:
    text: InriaSans-Regular

  logo: assets/images/Inria-mediation.png
  favicon: assets/images/logos/favicon.png
  name: material
  custom_dir: src/overrides
  palette:
    primary: custom
    accent: custom

  language: fr

  features:
    #- navigation.path
    - navigation.indexes
    #- navigation.top
    #- navigation.footer
    #- toc.integrate
    #- navigation.tabs
    #- navigation.tabs.sticky
    - navigation.sections

extra_css:
  - assets/stylesheets/base.css?v=20260715-1
  - assets/stylesheets/header.css?v=20260715-1
  - assets/stylesheets/footer.css?v=20260715-1
  - assets/stylesheets/cards.css?v=20260715-1
  - assets/stylesheets/actualites.css?v=20260715-1
  - assets/stylesheets/ressources.css?v=20260715-3
  - assets/stylesheets/events.css?v=20260715-1
  - assets/stylesheets/home.css?v=20260715-1
extra_javascript:
  - assets/javascripts/analytics/matomo.js
  - assets/javascripts/header-scroll.js
  - assets/javascripts/home-hero.js
  - assets/javascripts/home-carousel.js
  - assets/javascripts/home-partners-carousel.js?v=20260624-5
  - assets/javascripts/clickable-cards.js
  - assets/javascripts/reveal-on-scroll.js
  - assets/javascripts/search-results.js
  - assets/javascripts/resource-filters.js?v=20260715-4
  - assets/javascripts/content-share.js?v=20260806-1

nav:
  - Accueil: index.md
  - Nous connaître:
      - Nous connaître: nous-connaitre.md
      - Docs: docs/index.md
  - Actualités:
      - Tout: contenus/actualites/index.md
      - Actualités: contenus/actualites/actualites/index.md
      - Évènements: contenus/actualites/evenements/index.md
  - Ressources: contenus/ressources/index.md
  - Réseau: ecosysteme.md
  - Contact: contact.md

hooks:
  - scripts/build/optimize_images.py
  - scripts/build/content_dates.py
  - scripts/build/calendar_events.py
  - scripts/build/partners.py
  - scripts/build/section_collections.py
  - scripts/build/featured_actualites.py
  - scripts/build/search_metadata.py



markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - def_list
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - md_in_html
  - attr_list
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true


plugins:
    - mkdocs-video
    - awesome-pages
    - glightbox
    - table-reader
    - blog:
        blog_dir: docs
        blog_toc: true
        archive: false
        post_date_format: long
        post_url_format: "{slug}"
        authors: false
        pagination_per_page: 12
    - blog:
        blog_dir: contenus/ressources
        blog_toc: true
        archive: false
        post_date_format: long
        post_url_format: "{slug}"
        authors: false
        pagination_per_page: 1000
    - blog:
        blog_dir: contenus/actualites
        blog_toc: true
        archive: false
        post_date_format: long
        post_url_format: "{slug}"
        authors: false
        pagination_per_page: 1000
    - material/search:
        lang: fr
